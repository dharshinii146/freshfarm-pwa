<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshFarm Direct - All roles</title>
  <style>
    :root {
      --bg: #eef3ec;
      --card: #fff;
      --ink: #17261c;
      --mut: #5d6b60;
      --pri: #1f6b3a;
      --onpri: #fff;
      --deal: #c98a00;
      --bad: #b3261e;
      --line: #d5dfd3;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #101a13;
        --card: #1a271e;
        --ink: #e8f1e9;
        --mut: #9db0a0;
        --pri: #5fc47f;
        --onpri: #08210f;
        --deal: #f0b429;
        --bad: #ff8a80;
        --line: #2c3d31
      }
    }

    :root[data-theme="dark"] {
      --bg: #101a13;
      --card: #1a271e;
      --ink: #e8f1e9;
      --mut: #9db0a0;
      --pri: #5fc47f;
      --onpri: #08210f;
      --deal: #f0b429;
      --bad: #ff8a80;
      --line: #2c3d31
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px
    }

    h1 {
      font: 700 28px/1.15 Georgia, serif;
      margin: 0
    }

    h2 {
      font: 700 20px/1.2 Georgia, serif;
      margin: 0 0 10px
    }

    .sub {
      color: var(--mut);
      margin: 4px 0 14px
    }

    nav {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    nav button {
      flex: 1;
      min-width: 110px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      font: 600 15px inherit;
      cursor: pointer
    }

    nav button.on {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--mut);
      margin: 8px 0 3px
    }

    input,
    select {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      font: inherit
    }

    button.b {
      padding: 9px 14px;
      border: 0;
      border-radius: 6px;
      background: var(--pri);
      color: var(--onpri);
      font: 600 15px inherit;
      cursor: pointer;
      margin-top: 10px
    }

    button.s {
      background: transparent;
      color: var(--pri);
      border: 1px solid var(--pri);
      margin-right: 6px
    }

    button.r {
      background: transparent;
      color: var(--bad);
      border: 1px solid var(--bad);
      margin-right: 6px
    }

    .price {
      font-size: 20px;
      font-weight: 700
    }

    .old {
      text-decoration: line-through;
      color: var(--mut);
      font-size: 14px;
      margin-left: 6px
    }

    .tag {
      display: inline-block;
      background: var(--deal);
      color: #1b1300;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 13px;
      font-weight: 700
    }

    .pill {
      border-radius: 20px;
      padding: 1px 9px;
      font-size: 13px;
      border: 1px solid var(--line);
      color: var(--mut)
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 0;
      border-bottom: 1px solid var(--line)
    }

    .row:last-child {
      border: 0
    }

    .m {
      color: var(--mut);
      font-size: 14px
    }

    .msg {
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      margin-bottom: 12px
    }

    .note {
      font-size: 13px;
      color: var(--mut)
    }

    nav a {
      flex: 1;
      min-width: 110px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      text-align: center;
      text-decoration: none
    }

    nav a.on {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    .note a {
      color: var(--pri)
    }

    .home {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px
    }

    .home a {
      display: block;
      text-decoration: none;
      color: var(--ink)
    }

    .home-shell {
      display: block
    }

    .home-side {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 5px;
      margin: 0 0 24px;
      padding: 9px 12px;
      background: rgba(18, 46, 27, .96);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      backdrop-filter: blur(10px)
    }

    .home-side button {
      flex: 0 0 auto;
      width: auto;
      text-align: center;
      padding: 11px 16px;
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 6px 6px 3px 3px;
      background: transparent;
      color: #f4f7ed;
      font: 600 15px inherit;
      cursor: pointer;
      margin: 0;
      white-space: nowrap
    }

    .home-side button:hover {
      background: rgba(255, 255, 255, .1)
    }

    .home-side button.active {
      background: rgba(255, 255, 255, .12);
      border-bottom-color: var(--deal);
      color: #fff
    }

    .home-side .home-language {
      margin-left: auto;
      border-left: 1px solid rgba(255, 255, 255, .24);
      border-radius: 0;
      padding-left: 22px
    }

    .home-content {
      min-width: 0
    }

    .home-section {
      scroll-margin-top: 88px
    }

    .home-section+.home-section {
      margin-top: 20px
    }

    .home-section.box,
    .home .box {
      padding: 22px;
      background: #fff;
      color: #17261c;
      border-color: #d5dfd3;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(10, 30, 15, .16)
    }

    .home-section.box h2,
    .home .box h2 {
      color: #17261c
    }

    .home-section.box .m,
    .home .box .m {
      color: #536556
    }

    .home .box {
      min-height: 180px;
      border-top: 4px solid #1f6b3a;
      transition: transform .18s ease, box-shadow .18s ease
    }

    .home .box:nth-child(2) {
      border-top-color: #c98a00
    }

    .home .box:nth-child(3) {
      border-top-color: #4b8c76
    }

    .home .box:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(10, 30, 15, .22)
    }

    .home-section.box {
      padding: 24px
    }

    .home-section.box>h2 {
      font-size: 23px
    }

    body:has(.home-shell) .wrap {
      max-width: 1180px;
      padding: 24px
    }

    body:has(.home-shell) #h1 {
      font-size: 34px
    }

    body:has(.home-shell) #sub {
      font-size: 17px;
      margin-bottom: 20px
    }

    body:has(.home-shell) #ft {
      color: #fff
    }

    .dash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .dash-row:last-child {
      border-bottom: 0
    }

    .dash-row small {
      display: block;
      color: var(--mut);
      font-size: 13px
    }

    @media(max-width:700px) {
      body:has(.home-shell) .wrap {
        padding: 14px
      }

      .home-side {
        top: 0;
        overflow-x: auto;
        gap: 2px;
        margin-bottom: 18px;
        padding: 7px
      }

      .home-side button {
        padding: 10px 12px;
        font-size: 14px
      }

      .home-side .home-language {
        margin-left: 0;
        padding-left: 12px
      }

      .home {
        grid-template-columns: 1fr;
        gap: 12px
      }

      .home .box {
        min-height: 0;
        padding: 20px
      }

      .home-section.box {
        padding: 18px
      }
    }

    body:has(.home-shell) {
      background: linear-gradient(rgba(12, 34, 15, .48), rgba(12, 34, 15, .48)), url("pictures/Screenshot 2026-11-09 140401.png") center/cover fixed
    }

    body:has(.home-shell) #h1,
    body:has(.home-shell) #sub,
    body:has(.home-shell) #ft,
    body:has(.home-shell) #app>h2 {
      color: #fff;
      text-shadow: 0 1px 5px rgba(0, 0, 0, .7)
    }

    .tabb {
      flex: 1;
      min-width: 110px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin: 0
    }

    .tabb.on {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    .thumb {
      width: 120px;
      height: 86px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: zoom-in;
      display: block
    }

    .trk {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 8px 0;
      font-size: 14px
    }

    .stp {
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--mut)
    }

    .stp.on {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    .stp small {
      opacity: .85
    }

    .arr {
      color: var(--mut)
    }

    .eta-line {
      font-size: 18px;
      margin: 4px 0;
      color: var(--pri)
    }

    .route {
      margin: 8px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg)
    }

    .rline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0
    }

    .rend {
      font-size: 13px;
      color: var(--mut);
      max-width: 30%
    }

    .road {
      position: relative;
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      margin: 0 10px
    }

    .dot {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      font-style: normal;
      font-size: 22px;
      transition: left 1s linear
    }

    .map {
      width: 100%;
      height: 220px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 6px;
      background: #fff
    }

    .nbar {
      border: 2px solid var(--deal);
      background: var(--card);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px
    }
  </style>

  <meta name="theme-color" content="#1f6b3a">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">

</head>

    }

    var LASTN = -1;

    function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); setTimeout(function () { o.stop(); a.close() }, 180) } catch (e) { } }

  </script>
  <script>

    }
    function requestProduce() {
      load(); var name = document.getElementById("reqName").value.trim(), item = document.getElementById("reqItem").value.trim(), qty = +document.getElementById("reqQty").value, unit = document.getElementById("reqUnit").value, phone = document.getElementById("reqPhone").value.trim(), note = document.getElementById("reqNote").value.trim();
      if (!name || !item || !(qty > 0)) return fail("Enter your name, an item, and a valid quantity.");
      if (phone.replace(/\D/g, "").length < 10) return fail("Enter a phone number with at least 10 digits.");
      S.requests = S.requests || []; S.requests.push({ id: S.n++, name: name, item: item, qty: qty, unit: unit, phone: phone, note: note, created: Date.now() });
      S.farmers.filter(function (f) { return f.st == "approved" }).forEach(function (f) { notify("f" + f.id, tt("Customer request") + ": " + name + " · " + qty + " " + unit + " " + item + " · " + phone + (note ? " · " + note : "")) });
      if (!save()) return fail("Could not save this request in browser storage."); say("Request posted."); var list = document.getElementById("open-requests"); if (list) list.scrollIntoView({ behavior: "smooth", block: "center" })
    }
    function homeView() {
      var card = function (h, t, d) { return '<a class="box" href="#' + h + '" style="display:block;text-decoration:none;color:inherit"><h2>' + t + '</h2><span class="m">' + d + '</span></a>' };

      else if (homeTab == "quantity") content = '<section class="home-section box"><h2>Quantity sold</h2><p class="note">Completed deliveries only; cancelled and failed orders are excluded.</p>' + quantityRows() + '</section>';
      else if (homeTab == "market-live") content = '<section class="home-section box"><h2>Market Live</h2><p class="note">Demo reference rates (not live market data).</p>' + marketRows() + '</section>';
      else if (homeTab == "customer-requests") content = '<section class="home-section box" id="customer-requests"><h2>Customer request</h2><p class="m">Request produce based on what you need.</p><div class="grid"><div><label>Customer name</label><input id="reqName" autocomplete="name"></div><div><label>Item or crop</label><input id="reqItem" placeholder="e.g. Tomato"></div><div><label>Required quantity</label><input id="reqQty" type="number" min="0.1" step="0.1"></div><div><label>Unit</label><select id="reqUnit"><option>kg</option><option>bunch</option><option>piece</option><option>bag</option></select></div><div><label>Phone for follow-up</label><input id="reqPhone" type="tel" inputmode="tel"></div></div><label>Note (optional)</label><input id="reqNote" placeholder="Variety, preferred date, or other details"><button class="b" onclick="requestProduce()">Submit request</button><h2 id="open-requests" style="margin-top:18px">Open customer requests</h2>' + requestRows() + '<p class="note">Requests are saved in this browser for this demo.</p></section>';

        + card("fpo", "I am an FPO officer", "Verify farmers, handle order problems and stock about to spoil.")

      return '<div class="home-shell"><nav class="home-side" aria-label="Home sections">' + nav + '<button class="home-language" aria-label="Switch language" onclick="setLang(LANG==\'ta\'?\'en\':\'ta\')">' + (LANG == "ta" ? "English" : "தமிழ்") + '</button></nav><main class="home-content">' + content + '</main></div>'
    }
    function view() {
      var r = curRole(); if (!r) return homeView();
      return '<div style="margin-bottom:12px"><a href="#" class="tabb" style="display:inline-block;width:auto;min-width:0;text-decoration:none">\u2190 Change role</a></div>' + (r == "c" ? vC() : r == "f" ? vF() : fpoView())
    }
    window.addEventListener("hashchange", function () { notice = ""; if (!curRole()) homeTab = "home"; render() });

    function vC() {
      var h = '<div class="box"><h2>Your details</h2><div class="grid"><div><label>Name</label><input id="cn" onchange="saveCust()" value="' + esc(S.cust.name) + '"></div><div><label>Phone</label><input id="cp" onchange="saveCust()" value="' + esc(S.cust.phone) + '"></div></div><label>Delivery address (house / street / village)</label><input id="ca" onchange="saveCust()" value="' + esc(S.cust.addr) + '"><label>Landmark (optional)</label><input id="cl" onchange="saveCust()" value="' + esc(S.cust.land) + '"><button class="b s" onclick="useMyLoc()">Use my current location</button> <span class="m" id="cls">' + (S.cust.geo ? "\u2713 Location added" : "") + '</span></div>';
      var ps = S.products.filter(function (p) { var f = fm(p.fid); return p.qty > 0 && left(p) >= 0 && f && f.st == "approved" });
      h += '<h2>Fresh from farmers</h2>';
      if (!ps.length) h += '<div class="box">Nothing listed right now. Check back after farmers add stock.</div>';
      h += '<div class="grid">' + ps.map(function (p) {
        var f = fm(p.fid), d = disc(p);
        return '<div class="box"><b>' + esc(p.name) + '</b> ' + (d ? '<span class="tag">' + Math.round(d * 100) + '% off</span>' : "") + '<div class="m">' + esc(f.name) + ', ' + esc(f.village) + '</div><div><span class="price">₹' + pr(p) + '</span>/' + esc(p.unit) + (d ? '<span class="old">₹' + p.price + '</span>' : "") + '</div><div class="m">' + p.qty + ' ' + esc(p.unit) + ' left · harvested ' + esc(p.harvest) + ' · sell by ' + esc(p.sell) + '</div><label>Quantity</label><input type="number" id="q' + p.id + '" min="1" max="' + p.qty + '" value="1"><button class="b" onclick="order(' + p.id + ')">Place order</button></div>'

      return h
    }

    function order(id) {
      var n = document.getElementById("cn").value.trim(), ph = document.getElementById("cp").value.trim(), a = document.getElementById("ca").value.trim(), l = document.getElementById("cl").value.trim(), g0 = S.cust.geo || null; S.cust = { name: n, phone: ph, addr: a, land: l, geo: g0 };
      if (!n || ph.length < 10) { save(); return fail("Enter your name and a 10-digit phone number first.") }
      if (a.length < 5) { save(); return fail("Enter your delivery address first.") }
      var p = S.products.filter(function (x) { return x.id == id })[0], q = parseInt(document.getElementById("q" + id).value, 10);
      if (!q || q < 1 || q > p.qty) { save(); return fail("Choose a quantity between 1 and " + p.qty + ".") }

      say("Order placed: " + q + " " + p.unit + " " + p.name + " for ₹" + q * pr(p) + ". The farmer has been notified.")
    }

    function vF() {
      var f = fs && fm(fs);
      if (!f) return '<div class="grid"><div class="box"><h2>Farmer login</h2><label>Phone</label><input id="lp"><label>Password</label><input id="lw" type="password"><button class="b" onclick="login()">Log in</button></div><div class="box"><h2>New farmer? Register</h2><label>Name</label><input id="rn"><label>Village</label><input id="rv"><label>Phone</label><input id="rp"><label>Select your FPO</label><select id="rfp">' + FPOS.map(function (x) { return '<option>' + esc(x) + '</option>' }).join("") + '</select><label>Land size (acres)</label><input id="ra" type="number" step="0.1"><label>Crops grown</label><input id="rc"><label>Land record (patta) no.</label><input id="rl"><label>FPO membership no. (leave blank if you are new)</label><input id="rf"><label>ID proof type</label><select id="rt"><option value="Aadhaar card">Aadhaar card</option><option value="Voter ID">Voter ID</option><option value="Other government ID">Other government ID</option></select><label>ID proof photo (Aadhaar / voter ID)</label><input type="file" accept="image/*" onchange="pick(this,\'id\')"><div class="m" id="pst_id">' + (IMG.id ? "\u2713 Photo added" : "") + '</div><label>Land record photo (patta / chitta)</label><input type="file" accept="image/*" onchange="pick(this,\'land\')"><div class="m" id="pst_land">' + (IMG.land ? "\u2713 Photo added" : "") + '</div><label>Create password</label><input id="rw" type="password"><button class="b" onclick="reg()">Send for FPO approval</button></div></div>';
      var h = '<div class="box"><div class="row"><b>Welcome, ' + esc(f.name) + '</b><button class="b s" onclick="out()">Log out</button></div></div>';
      h += '<div class="box"><h2>List a product</h2><div class="grid"><div><label>Crop</label><input id="pn"></div><div><label>Price per unit (₹)</label><input id="pp" type="number"></div><div><label>Quantity</label><input id="pq" type="number"></div><div><label>Unit (kg, bunch...)</label><input id="pu" value="kg"></div><div><label>Harvest date</label><input id="ph" type="date" value="' + D(0) + '"></div><div><label>Sell-by date</label><input id="ps" type="date" value="' + D(4) + '"></div></div><button class="b" onclick="addP()">Add to shop</button></div>';

      h += '<div class="box"><h2>Your listings</h2>' + (mp.length ? mp.map(function (p) { return '<div class="row"><span>' + esc(p.name) + ' · ' + p.qty + ' ' + esc(p.unit) + ' · ₹' + pr(p) + '</span><span class="m">sell by ' + esc(p.sell) + '</span></div>' }).join("") : '<span class="m">No listings yet. Add your first crop above.</span>') + '</div>';
      var mo = S.orders.filter(function (o) { return o.fid == f.id });
      h += '<div class="box"><h2>Orders to deliver</h2>' + (mo.length ? mo.map(farmOrd).join("") : '<span class="m">No orders yet.</span>') + '</div>';
      return h
    }

    function login() {
      var ph = document.getElementById("lp").value.trim(), pw = document.getElementById("lw").value, f = S.farmers.filter(function (x) { return x.phone == ph && x.pw == pw })[0];
      if (!f) return fail("Wrong phone or password."); if (f.st == "pending") return fail("Your account is waiting for FPO approval. You will get a login SMS once approved."); if (f.st == "rejected") return fail("The FPO did not approve this account. Contact your FPO office." + (f.reason ? " Reason: " + f.reason : "")); fs = f.id; try { sessionStorage.setItem("ffd_fs", fs) } catch (e) { } say("")
    }

    function reg() {
      var v = function (i) { return document.getElementById(i).value.trim() };
      if (!v("rn") || !v("rv") || v("rp").length < 10 || !v("rl") || !(+v("ra") > 0) || !v("rc") || v("rw").length < 4) return fail("Fill every field. Phone needs 10 digits and password at least 4 characters.");
      if (S.farmers.some(function (x) { return x.phone == v("rp") })) return fail("This phone number is already registered.");
      if (!IMG.id || !IMG.land) return fail("Please add both photos: ID proof and land record.");
      S.farmers.push({ id: S.n++, name: v("rn"), village: v("rv"), phone: v("rp"), fpoName: v("rfp"), acres: +v("ra"), crops: v("rc"), land: v("rl"), fpo: v("rf"), pw: v("rw"), st: "pending", chk: {}, idType: v("rt"), docs: { id: IMG.id, land: IMG.land } }); if (!save()) return fail("Could not save (browser storage full). Use smaller photos."); IMG = {}; say("Sent to your FPO. You can log in after approval.")
    }
    function addP() {
      var v = function (i) { return document.getElementById(i).value.trim() };
      if (!v("pn") || !(+v("pp") > 0) || !(+v("pq") > 0) || !v("ps")) return fail("Enter crop, price, quantity and sell-by date.");
      S.products.push({ id: S.n++, fid: fs, name: v("pn"), price: +v("pp"), qty: +v("pq"), unit: v("pu") || "kg", harvest: v("ph"), sell: v("ps"), sur: 0 }); save(); say("Added. Customers can see it now.")
    }



    function vP() {
      var pend = S.farmers.filter(function (f) { return f.st == "pending" }), ok = S.farmers.filter(function (f) { return f.st == "approved" });
      var h = pendBox(pend) + regBox();

      var ex = S.products.filter(function (p) { return p.qty > 0 && left(p) <= 2 });
      h += '<div class="box"><h2>Stock about to spoil (2 days or less)</h2>' + (ex.length ? ex.map(function (p) { var f = fm(p.fid); return '<div class="row"><span><b>' + esc(p.name) + '</b> · ' + p.qty + ' ' + esc(p.unit) + ' · ' + esc(f ? f.name : "") + '<div class="m">sell by ' + esc(p.sell) + (left(p) < 0 ? " (expired)" : "") + '</div></span><span>' + (left(p) >= 0 && !p.sur ? '<button class="b s" onclick="act(' + p.id + ',\'s\')">Surplus deal −25%</button>' : "") + '<button class="b s" onclick="act(' + p.id + ',\'b\')">FPO buys at 60%</button><button class="b s" onclick="act(' + p.id + ',\'d\')">Process / donate</button></span></div>' }).join("") : '<span class="m">Nothing close to its sell-by date.</span>') + '<p class="note">Items 3 days from expiry get 10% off automatically, and 1 day or less gets 25% off.</p></div>';
      h += probBox();
      h += '<div class="box"><h2>Action log</h2>' + (S.log.length ? S.log.slice().reverse().map(function (l) { return '<div class="row"><span class="m">' + esc(l) + '</span></div>' }).join("") : '<span class="m">No actions yet.</span>') + '</div>';
      return h
    }

    function matchInfo(f) {
      var m = S.members.filter(function (x) { return x.no == f.fpo })[0];
      if (f.fpo) {
        if (!m) return ["bad", "Number not found in member register"];
        if (m.phone == f.phone && m.name.toLowerCase() == f.name.toLowerCase()) return ["ok", "Match found: number, name and phone agree"];
        return ["warn", "Number found but name or phone differs"]
      }
      var p = S.members.filter(function (x) { return x.phone == f.phone })[0];
      return p ? ["warn", "No number given, but this phone is in the member register"] : ["warn", "New applicant: not in member register. Check documents."];
    }
    function pendBox(pend) {
      return '<div class="box"><h2>Farmers waiting for approval</h2>' + (pend.length ? pend.map(function (f) {
        var mi = matchInfo(f), c = f.chk || {}, col = mi[0] == "ok" ? "var(--pri)" : mi[0] == "bad" ? "var(--bad)" : "var(--deal)";
        var ck = function (k, l) { return '<label style="display:flex;gap:8px;align-items:center;color:inherit;font-size:15px"><input type="checkbox" style="width:auto" ' + (c[k] ? "checked" : "") + ' onchange="tick(' + f.id + ',\'' + k + '\',this.checked)"> ' + l + '</label>' };
        return '<div class="row" style="display:block"><b>' + esc(f.name) + '</b>, ' + esc(f.village) + '<div class="m">' + esc(f.phone) + ' · ' + esc(f.fpoName || "") + '</div>'
          + '<div class="m">Land size (acres): ' + esc(f.acres) + ' · Crops grown: ' + esc(f.crops) + '</div>'
          + '<div class="m">Land record (patta) no.: ' + esc(f.land) + ' · FPO membership no.: ' + esc(f.fpo || "-") + '</div>'
          + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0">' + docBox("ID proof photo (" + esc(f.idType || "-") + ")", (f.docs || {}).id) + docBox("Land record photo", (f.docs || {}).land) + '</div>'
          + '<div class="msg" style="border-left:4px solid ' + col + ';margin:8px 0">' + mi[1] + '</div>'
          + ck("id", "Identity checked") + ck("land", "Land record checked") + ck("tel", "Phone verified by call")
          + (f.fpo ? '' : '<label>Assign membership number</label><input id="an' + f.id + '" placeholder="FPO-103">')
          + '<label>Reason for rejection</label><input id="rj' + f.id + '">'
          + '<button class="b s" onclick="ap(' + f.id + ',\'approved\')">Approve</button><button class="b r" onclick="ap(' + f.id + ',\'rejected\')">Reject</button></div>'
      }).join("") : '<span class="m">No pending requests.</span>') + '</div>'
    }
    function regBox() { return '<div class="box"><h2>FPO member register</h2>' + (S.members.length ? S.members.map(function (m) { return '<div class="row"><span>' + esc(m.name) + ' · ' + esc(m.phone) + '</span><span class="pill">' + esc(m.no) + '</span></div>' }).join("") : '<span class="m">None yet.</span>') + '<div class="grid" style="margin-top:8px"><div><label>FPO membership no.</label><input id="mn"></div><div><label>Name</label><input id="mm"></div><div><label>Phone</label><input id="mp"></div></div><button class="b s" onclick="addM()">Add member</button></div>' }
    function addM() {
      var v = function (i) { return document.getElementById(i).value.trim() };
      if (!v("mn") || !v("mm") || v("mp").length < 10) return fail("Enter membership number, name and a 10-digit phone.");
      if (S.members.some(function (x) { return x.no == v("mn") })) return fail("This membership number is already used.");
      S.members.push({ no: v("mn"), name: v("mm"), phone: v("mp"), fpoName: "" }); save(); say("Member added.")
    }
    function tick(id, k, v) { var f = fm(id); f.chk = f.chk || {}; f.chk[k] = v; save() }
    function ap(id, s) {
      var f = fm(id), c = f.chk || {};
      if (s == "approved") {
        if (!(f.docs && f.docs.id && f.docs.land)) return fail("This farmer has not uploaded both photos yet.");
        if (!(c.id && c.land && c.tel)) return fail("Please tick all three checks before approving.");
        if (!f.fpo) {
          var a = document.getElementById("an" + id).value.trim();
          if (!a) return fail("Enter the membership number to assign.");
          if (S.members.some(function (x) { return x.no == a })) return fail("This membership number is already used.");
          f.fpo = a; S.members.push({ no: a, name: f.name, phone: f.phone, fpoName: f.fpoName })
        }
        f.st = "approved"; save(); return fail("Farmer approved.")
      }
      var r = document.getElementById("rj" + id).value.trim(); if (!r) return fail("Enter a reason for rejection.");
      f.st = "rejected"; f.reason = r; save(); say("Farmer rejected.")
    }
    function act(id, a) {
      var p = S.products.filter(function (x) { return x.id == id })[0];
      if (a == "s") { p.sur = 1; S.log.push(p.name + ": moved to Surplus Deals at 25% off") }
      if (a == "b") { S.log.push(p.name + ": FPO bought " + p.qty + " " + p.unit + " at ₹" + Math.round(p.price * .6) + " each for the collection centre"); p.qty = 0 }
      if (a == "d") { S.log.push(p.name + ": " + p.qty + " " + p.unit + " sent to processing or donation"); p.qty = 0 }
      save(); say("Done.")
    }

    function fpoIn() { if (document.getElementById("fu").value.trim() == "fpo" && document.getElementById("fw").value == "admin123") { ok = true; try { sessionStorage.setItem("ffd_fpo", "1") } catch (e) { } say("") } else fail("Wrong ID or password.") }

    function fpoOut() { ok = false; try { sessionStorage.removeItem("ffd_fpo") } catch (e) { } render() }

    function out() { fs = null; try { sessionStorage.removeItem("ffd_fs") } catch (e) { } render() }
    function custOrd(o) {
      var h = '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>' + esc(o.pn) + ' × ' + o.q + '</span><span class="m">₹' + o.t + ' · <span class="pill">' + esc(o.st) + '</span></span></div>';
      var d = ordTxt(o); if (d) h += '<div class="m">' + esc(d) + '</div>';
      h += addrBlock(o, "Delivering to:");
      h += track(o);
      if (o.st == "New") h += '<div style="max-width:340px"><select id="cr' + o.id + '"><option value="">Reason for cancelling</option><option>Changed my mind</option><option>Ordered by mistake</option><option>Delivery is taking too long</option><option>Found another option</option></select><button class="b r" onclick="cancelOrd(' + o.id + ')">Cancel order</button></div>';
      if (o.st == "Out for delivery") h += '<div class="m">On its way. This order can no longer be cancelled.</div>';
      if (o.st == "Delivered") h += '<div style="max-width:340px"><select id="cr' + o.id + '"><option value="">Report a problem</option><option>Poor quality or damaged</option><option>Wrong quantity received</option><option>Order not received</option></select><label>Describe the problem (optional)</label><input id="cx' + o.id + '"><button class="b s" onclick="reportIssue(' + o.id + ')">Send to FPO</button></div>';
      return h + '</div>'
    }
    function cancelOrd(id) {
      load(); var o = ordById(id), r = document.getElementById("cr" + id).value;
      if (!o || o.st != "New") return fail("This order is already on its way, so it cannot be cancelled. If there is a problem, report it after delivery.");
      if (!r) return fail("Choose a reason first.");
      o.st = "Cancelled"; o.why = r; restock(o); notify("f" + o.fid, "Order cancelled by customer: " + o.pn + " × " + o.q + " · reason: " + r); save(); say("Order cancelled. The farmer has been informed and the stock is returned.")
    }
    function reportIssue(id) {
      load(); var o = ordById(id), r = document.getElementById("cr" + id).value;
      if (!o || o.st != "Delivered") return render();
      if (!r) return fail("Choose a reason first.");
      o.st = "Issue reported"; o.why = r; o.note = document.getElementById("cx" + id).value.trim(); notify("p", "New order problem: " + o.pn + " · " + r); notify("f" + o.fid, "New order problem: " + o.pn + " · " + r); save(); say("Your problem has been sent to the FPO officer.")
    }

    function farmOrd(o) {
      var h = '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>' + esc(o.pn) + ' × ' + o.q + ' for ' + esc(o.cn) + ' (' + esc(o.cp) + ')</span><span>₹' + o.t + ' <span class="pill">' + esc(o.st) + '</span></span></div>';
      var d = ordTxt(o); if (d) h += '<div class="m">' + esc(d) + '</div>';
      h += addrBlock(o, "Deliver to:");
      h += track(o);
      if (o.st == "New") h += '<div style="max-width:340px"><select id="et' + o.id + '">' + etaOpts() + '</select><button class="b s" onclick="startDel(' + o.id + ')">Start delivery</button></div>';
      if (o.st == "Out for delivery") h += '<div style="max-width:340px"><label>Where are you now? (optional)</label><input id="wh' + o.id + '" value="' + esc(o.where || "") + '"><button class="b s" onclick="updWhere(' + o.id + ')">Update location</button><button class="b s" onclick="shareGps(' + o.id + ')">Share live GPS location</button><div class="m" id="gs' + o.id + '">' + (o.geo && Date.now() - o.geo.t < 12e4 ? 'GPS location is on (' + fmtT(o.geo.t) + ')' : '') + '</div> <button class="b s" onclick="nearBy(' + o.id + ')">I\'m nearby (about 5 minutes)</button><label>Running late? Change expected time</label><select id="et' + o.id + '">' + etaOpts() + '</select><button class="b s" onclick="updEta(' + o.id + ')">Update time</button><br><button class="b s" onclick="done(' + o.id + ')">Mark delivered</button></div>';
      if (o.st == "New" || o.st == "Out for delivery") h += '<div style="max-width:340px"><select id="fr' + o.id + '"><option value="">Reason if you cannot deliver</option><option>Customer not reachable</option><option>Customer refused the order</option><option>Address not found</option><option>Road or vehicle problem</option><option>Produce got damaged</option></select><button class="b r" onclick="failDel(' + o.id + ')">Can\'t deliver</button></div>';
      return h + '</div>'
    }
    function startDel(id) {
      load(); var o = ordById(id), s = document.getElementById("et" + id);
      if (!o || o.st != "New") return render();
      if (!s || !s.value) return fail("Choose the expected delivery time first.");
      o.st = "Out for delivery"; o.tm = o.tm || {}; o.tm.out = Date.now(); o.etaAt = Date.now() + (+s.value) * 6e4; o.etaTxt = ETL[s.value];
      notify("c" + o.cp, "Your order " + o.pn + " is out for delivery. Expected: " + o.etaTxt); save(); say("Delivery started. The customer can now see your expected time.")
    }
    function updWhere(id) {
      load(); var o = ordById(id); if (!o || o.st != "Out for delivery") return render();
      o.where = document.getElementById("wh" + id).value.trim(); save(); say("Location updated.")
    }
    function nearBy(id) {
      load(); var o = ordById(id); if (!o || o.st != "Out for delivery") return render();
      o.near = true; o.tm = o.tm || {}; o.tm.near = Date.now(); o.etaAt = Date.now() + 5 * 6e4; o.etaTxt = "In 5 minutes"; notify("c" + o.cp, "Your order " + o.pn + ": the farmer is nearby (about 5 minutes)."); save(); say("The customer has been told you are nearby.")
    }
    function updEta(id) {
      load(); var o = ordById(id), s = document.getElementById("et" + id); if (!o || o.st != "Out for delivery") return render();
      if (!s || !s.value) return fail("Choose the expected delivery time first.");
      o.etaAt = Date.now() + (+s.value) * 6e4; o.etaTxt = ETL[s.value]; notify("c" + o.cp, "Delivery time changed for " + o.pn + ": " + o.etaTxt); save(); say("Expected time updated.")
    }
    function done(id) { load(); var o = ordById(id); if (o && o.st == "Out for delivery") { o.st = "Delivered"; o.tm = o.tm || {}; o.tm.del = Date.now(); notify("c" + o.cp, "Your order " + o.pn + " was delivered. If anything is wrong, report a problem."); save() } render() }
    function failDel(id) {
      load(); var o = ordById(id), r = document.getElementById("fr" + id).value;
      if (!o || (o.st != "New" && o.st != "Out for delivery")) return render();
      if (!r) return fail("Choose a reason first.");
      o.st = "Delivery failed"; o.why = r; notify("c" + o.cp, "Delivery failed for your order " + o.pn + ": " + r);
      if (r == "Produce got damaged") { S.log.push(o.pn + ": " + o.q + " damaged during delivery (not restocked)"); save(); return say("Marked as failed. Damaged produce is not returned to the shop; the FPO will be told.") }
      restock(o); save(); say("Marked as failed. Stock returned to the shop.")
    }

    function probBox() {
      var op = S.orders.filter(function (o) { return o.st == "Issue reported" });
      var past = S.orders.filter(function (o) { return o.st == "Cancelled" || o.st == "Delivery failed" || o.st == "Resolved" }).slice(-5).reverse();
      var h = '<div class="box"><h2>Order problems</h2>';
      if (!op.length) h += '<span class="m">No order problems.</span>';
      op.forEach(function (o) {
        var f = fm(o.fid);
        h += '<div class="row" style="display:block"><b>' + esc(o.pn) + ' × ' + o.q + '</b> · ₹' + o.t + '<div class="m">Farmer: ' + esc(f ? f.name : "") + ' · Customer: ' + esc(o.cn) + ' (' + esc(o.cp) + ')</div><div class="m">' + esc(ordTxt(o)) + '</div>'
          + '<label>Decision</label><select id="dc' + o.id + '"><option value="">Choose a decision</option><option>Refund the customer</option><option>Send a replacement</option><option>Reject the complaint</option></select>'
          + '<label>Note to both sides (optional)</label><input id="dn' + o.id + '"><button class="b s" onclick="resolveIss(' + o.id + ')">Decide</button></div>'
      });
      if (past.length) h += '<h2 style="margin-top:14px">Recent cancelled and failed orders</h2>' + past.map(function (o) { return '<div class="row" style="display:block"><span>' + esc(o.pn) + ' × ' + o.q + ' · ' + esc(o.cn) + ' <span class="pill">' + esc(o.st) + '</span></span><div class="m">' + esc(ordTxt(o)) + '</div></div>' }).join("");
      return h + '</div>'
    }
    function resolveIss(id) {
      load(); var o = ordById(id), d = document.getElementById("dc" + id).value;
      if (!o || o.st != "Issue reported") return render();
      if (!d) return fail("Choose a decision first.");
      var n = document.getElementById("dn" + id).value.trim(); o.st = "Resolved"; o.res = d + (n ? " \u2014 " + n : ""); notify("c" + o.cp, "FPO decision on " + o.pn + ": " + o.res); notify("f" + o.fid, "FPO decision on " + o.pn + ": " + o.res); save(); say("Problem recorded. Customer and farmer can see the decision.")
    }

    render();
  </script><button id="inst" class="b"
    style="display:none;position:fixed;right:14px;bottom:14px;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)"></button>
  <div id="ioshint" class="nbar"
    style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:5;margin:0"></div>
  <script>
    /* ===== install as an app (PWA) ===== */
    (function () {
      if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }) });
      PH.push(["Install app", "\u0b86\u0baa\u0bcd\u0bb8\u0bcd \u0ba8\u0bbf\u0bb1\u0bc1\u0bb5\u0bc1"], ["On iPhone: tap the Share button, then \u201cAdd to Home Screen\u201d to install this app.", "iPhone-\u0bb2\u0bcd: Share \u0baa\u0b9f\u0bcd\u0b9f\u0ba9\u0bc8 \u0b85\u0bb4\u0bc1\u0ba4\u0bcd\u0ba4\u0bbf, \u201cAdd to Home Screen\u201d \u0ba4\u0bc7\u0bb0\u0bcd\u0bb5\u0bc1 \u0b9a\u0bc6\u0baf\u0bcd\u0baf\u0bb5\u0bc1\u0bae\u0bcd."], ["Close", "\u0bae\u0bc2\u0b9f\u0bc1"]);
      PH.sort(function (a, b) { return b[0].length - a[0].length });
      var btn = document.getElementById("inst"), hint = document.getElementById("ioshint"), ev = null,
        app = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      function label() { btn.textContent = tt("Install app") }
      window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); ev = e; if (!app) { label(); btn.style.display = "block" } });
      window.addEventListener("appinstalled", function () { btn.style.display = "none" });
      btn.onclick = function () { if (!ev) return; ev.prompt(); ev.userChoice.then(function () { ev = null; btn.style.display = "none" }) };
      if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !app && !sessionStorage.getItem("ffd_ioshint")) {
        hint.innerHTML = '<span>' + tt("On iPhone: tap the Share button, then \u201cAdd to Home Screen\u201d to install this app.") + '</span> <button class="b s" style="margin:6px 0 0" onclick="this.parentNode.style.display=\'none\';sessionStorage.setItem(\'ffd_ioshint\',1)">' + tt("Close") + '</button>'; hint.style.display = "block"
      }
    })();
  </script>
</body>
